[project]
name = "mtg-price-prediction"
version = "0.1.0"
description = "Predicts a price range for an MTG card printing (released or unreleased) from a comps/similarity model over rarity, mechanical properties, art, and usage data."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0", "ipykernel>=6.0"]
# Deep GP stack (dataset build, embeddings, training, export, gp_static), kept
# separate so the nightly pipeline (requirements/pipeline.txt) needs no torch.
ml = [
    "scikit-learn>=1.4",
    "torch>=2.2",
    "gpytorch>=1.11",
    "safetensors>=0.4",
    "ijson>=3.2",
    "sentence-transformers>=3.0",
    "open-clip-torch>=2.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
